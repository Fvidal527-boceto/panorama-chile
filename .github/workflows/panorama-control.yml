name: PANORAMA - control editorial y publicacion
on:
  push:
    branches: [main]
    paths:
      - 'ediciones/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/panorama-control.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * *'
    - cron: '0 19 * * *'
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar portada y lector
        run: |
          node tests/portada.test.cjs
          node --test tests/lectura-voz.test.cjs
      - name: Verificar indice, profundidad y servicio
        run: node tests/calidad-edicion.cjs
      - name: Preparar navegador de control visual
        run: |
          mkdir -p "$RUNNER_TEMP/panorama-visual"
          npm install --prefix "$RUNNER_TEMP/panorama-visual" --no-save --no-audit --no-fund playwright-core@1.55.0
      - name: Comprobar compaginacion en escritorio y movil
        run: node tests/panorama-visual.cjs
      - name: Guardar capturas de inspeccion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panorama-capturas
          path: ${{ runner.temp }}/panorama-capturas/*.png
          retention-days: 3
          if-no-files-found: ignore
      - name: Comprobar disponibilidad publica con reintentos
        run: node tests/publicacion-web.cjs
      - name: Confirmar arquitectura gratuita
        run: |
          echo 'Control automatizado con GitHub Actions sobre repositorio publico.'
          echo 'No se producen ediciones ni se cambia la automatizacion de ChatGPT.'
          echo 'No se realizan despliegues en Netlify, ni se contratan servicios.'
